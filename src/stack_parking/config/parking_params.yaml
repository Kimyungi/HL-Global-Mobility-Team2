# stack_parking vehicle/GPS localization + LiDAR mapping + parking parameters.
#
# Vehicle constants are copies for ROS parameter injection only. Their single
# project source is stack_avoid/config/params.yaml; measurement rationale is in
# stack_parking/MEASUREMENTS.md. Keep them synchronized after a re-measurement.
/**:
  ros__parameters:
    map_frame: parking_map
    base_frame: base_link
    # These are calibrated per-sensor clouds from multi_lidar_fusion.  The
    # parking node rejects any frame other than base_link, so
    # publish_sensor_clouds=true and sensor_cloud_frame=base_link are required.
    front_cloud_topic: /lidar/a1/cloud
    rear_cloud_topic: /lidar/a2/cloud
    rear_scan_topic: /lidar/a2/scan
    vehicle_topic: /vehicle/vector
    imu_topic: /perception/imu
    gps_topic: /perception/gps_path
    slam_rate_hz: 10.0
    publish_rate_hz: 10.0
    debug_publish_rate_hz: 5.0

    cloud:
      sync_tolerance_s: 0.08
      stale_timeout_s: 0.35
      queue_size: 5
      min_range_m: 0.15
      # Parking-only cutoff. /unified_lidar/scan remains available at 12 m
      # for avoidance, E-stop, and other shared consumers.
      max_range_m: 4.0
      # Same rear-axle body box and margin as fusion_params.yaml.
      self_filter_margin_m: 0.02

    # VehicleVector.x/y/yaw are not consumed. dSPACE RX v+str drive a
    # kinematic-bicycle pose corrected by GPS position; the measured
    # str sign is opposite ROS +yaw, as verified in stack_avoid field logs.
    prior:
      velocity_timeout_s: 0.25
      imu_timeout_s: 0.25
      steering_timeout_s: 0.25
      max_dt_s: 0.30
      max_speed_mps: 3.0
      max_imu_rate_deg_s: 220.0
      imu_jump_margin_deg: 3.0
      use_imu: false
      use_steering: true
      steering_sign: -1.0
      steering_bias_deg: 0.0
      steering_deadband_deg: 0.3
      max_steering_deg: 30.0

    gps:
      # GpsPath delta is previous-base_link -> current-base_link. Only exact
      # RTK FIXED quality 4 + HEADING_FUSED is accepted; FLOAT(5), tangent and
      # reverse-ambiguous COG are intentionally rejected.
      use_position_correction: true
      use_yaw_fallback: true
      fix_quality: 4
      position_gain: 0.15
      innovation_gate_m: 1.50
      max_correction_m: 0.20

    stage:
      slam_confirm_scans: 10
      localization_confirm_scans: 3
      minimum_map_points: 80
    # Mapping starts at node startup and normally survives a parking trigger.
    reset_map_on_mission_start: false

    # LiDAR endpoints only build the map; ground returns cannot pull the pose.
    icp.map_correction_enabled: false
    # Positive N: delete any cell after N consecutive missing observations.
    # Zero retains the legacy farther-return clearing policy.
    icp.unobserved_delete_misses: 5

    # Clearing applies within 4m. With unobserved_delete_misses=5, empty and
    # occluded bearings count as misses too. The angular settings below only
    # affect the legacy farther-return policy (unobserved_delete_misses=0).
    icp.freespace_clear_enabled: true
    icp.freespace_clear_radius_m: 4.0
    icp.freespace_bin_width_deg: 1.0
    icp.freespace_margin_m: 0.02
    icp.freespace_occlusion_padding_deg: 1.5
    # New cells become confirmed after three observations. Both states expire
    # after five misses; the separate 1/3 thresholds only apply in legacy mode.
    icp.observation_match_radius_m: 0.02
    icp.tentative_confirm_hits: 3
    icp.tentative_delete_misses: 1
    icp.confirmed_delete_misses: 3

    # Existing GpsPath only has parking_zone (no type). The default below is
    # used on that rising edge. A GPS node that decides type should publish
    # "start perpendicular right" or "start parallel right" as std_msgs/String
    # on /parking/gps_command.
    auto_trigger_gps_zone: true
    gps_default_mode: perpendicular
    gps_default_side: right
    # Test-only. parking_standalone.launch.py overrides this to true. Never
    # enable together with the real stack_gps publisher.
    manual_test_publish_gps_gate: false

    slam_stale_timeout_s: 0.6
    rear_scan_stale_timeout_s: 0.35

    # rear(a2) sensor-frame centre: raw 270deg == normalized -90deg.
    # multi_lidar_fusion/config/lidar_extrinsics.yaml applies +0.069m range
    # correction to the fused cloud; raw LaserScan needs the same subtraction.
    rear_scan_center_deg: -90.0
    rear_scan_half_width_deg: 12.0
    rear_range_offset_m: 0.069
    rear_wall_min_points: 5
    rear_wall_cluster_m: 0.04

    vehicle:
      width_m: 0.62
      length_m: 0.85
      front_m: 0.760
      rear_m: 0.090
      wheelbase_m: 0.595
      min_turn_radius_m: 1.15
    lidar:
      rear_x_m: -0.110354

    icp:
      scan_voxel_m: 0.06
      # Runtime bound; polar stratification retains coverage from all 4 units.
      max_scan_points: 900
      map_voxel_m: 0.08
      max_correspondence_m: 0.35
      max_iterations: 18
      min_correspondences: 24
      max_rmse_m: 0.16
      local_map_radius_m: 8.0

    space:
      boundary_near_m: 0.42
      # User-selected field search limit for side-wall candidates.
      boundary_far_m: 3.0
      # Parallel space includes the two minimum-radius S arcs and vehicle
      # front/rear clearances; it is intentionally longer than body length.
      parallel_min_length_m: 2.90
      # Parallel-only decision landmark: the right side wall ends in a very
      # short 90deg tab which points left/toward the driving lane. Two mapped
      # point 8cm inward is accepted only with corner continuity, angle,
      # direction and the common 3-frame stability checks.
      parallel_decision_wall_min_length_m: 0.08
      parallel_decision_wall_min_points: 1
      parallel_decision_wall_x_tolerance_m: 0.10
      parallel_corner_connect_tolerance_m: 0.14
      parallel_corner_max_angle_error_deg: 35.0
      parallel_side_wall_min_length_m: 0.50
      perpendicular_min_width_m: 0.86
      # Independent of boundary_far_m: a T-bay back wall may be inside the
      # 3m side-wall search band and still counts once it is this deep.
      perpendicular_min_depth_m: 1.35
      stable_frames: 3

    path:
      sample_step_m: 0.06
      static_clearance_m: 0.035

    preview_distance_m: 1.0
    speed:
      # Project tests show steering authority collapses below ~0.5m/s. Keep
      # turning at >=0.5; only the final zero-curvature docking leg is slower.
      forward_mps: 0.60
      reverse_turn_mps: 0.55
      reverse_dock_mps: 0.15
      exit_mps: 0.55
    dock_slow_distance_m: 0.55
    completion_clearance_m: 0.20
    # Goal is 2cm inside the trigger so sampled/noisy data can cross <=20cm.
    completion_trigger_margin_m: 0.02
    parked_wait_s: 5.0
    # Safety: do not start the 5s timer without /vehicle/vector stop feedback.
    require_vehicle_stop_feedback: true

    dynamic:
      confirm_frames: 2
      static_match_m: 0.14
      clearance_m: 0.12
