# 로컬리제이션 라이다 4대의 장착값 — MEASUREMENTS.md 가 말하는 "실측값의 단일 소스".
#
# ★ 원본 관계 (값을 고칠 때 반드시 읽을 것)
#   - **차량 제원**(width/length/wheelbase/front_overhang)의 원본은
#     `../../stack_avoid/config/params.yaml` 이다. 여기에는 복제하지 않는다.
#     차체 앞단 +0.760 / 뒷단 −0.090 은 그 값에서 유도된 결과일 뿐이다.
#   - **이 파일이 원본인 것**은 라이다 4대의 장착 좌표와 적용 시야각뿐이다.
#   - 앞 라이다는 stack_avoid 와 같은 물리 유닛이다. 좌표를 고치면
#     stack_avoid/config/params.yaml 의 라이다 장착값도 함께 고쳐야 한다.
#
# 좌표계: vehicle frame(base_link) = 후축 중심, +x 전방, +y 좌, 단위 m / deg.
# 측정 경위와 근거는 ../MEASUREMENTS.md E절, 도면은 ../docs/lidar_layout.html.
#
# ⚠ 이 파일은 아직 어떤 노드도 로드하지 않는다. 주차 로컬맵 구현 시 여기서 읽을 것
#   — 값을 코드에 하드코딩하면 문서·코드가 갈라진다(본 파일이 생긴 이유).

lidar_mounts:
  # z 는 4대 동일(0.065) — 2D 스캔 병합의 전제. 2026-07-31 확인.
  front:
    x: 0.760
    y: 0.0
    z: 0.065
    # 적용 시야각: stack_avoid 와 공용 유닛이라 그쪽 ROI(정면 ±90°)를 따른다.
    fov_center_deg: 0.0
    fov_width_deg: 180.0
    # 장착 yaw = 이 유닛의 스캔 0도가 차량 기준 어느 쪽을 보는가 [deg].
    # 2026-08-14 실차 확정 (판을 정면 30/60cm 에 두고 검증).
    #   전제: 드라이버 lidar_type=1, reversion=true, inverted=false
    #
    # ★ -90 이 아니라 -85 다. 규약값(정면 = raw 270)을 그대로 쓰면 -90 이 되는데,
    #   실측은 raw 276(inverted=true 시절) -> 지금 설정에서 raw 84 였다. 즉 규약값과
    #   6도 어긋난다. 겹침 쌍 비교(앞↔오른쪽)의 각도 차 -4.98도와 부호·크기가 맞아
    #   서로 독립적인 두 측정이 같은 결론을 낸다. 두 값의 절충으로 -85 를 쓴다.
    #   ⚠ 규약값으로 되돌리지 말 것 — 그러면 앞 라이다만 5~6도 틀어진다.
    yaw_deg: -87.0
    note: "앞범퍼. stack_avoid 와 같은 유닛·같은 토픽"
  left:
    x: 0.310
    y: 0.155
    z: 0.065
    # ★ 2026-08-13 RViz 확인 후 지정: **스캔 raw 180도가 정면**(= 차량 좌측)이고
    #   raw 120~250 도만 쓴다. 정면 기준 -60 / +70 로 비대칭이다 — 의도된 값이다.
    #   vehicle frame 표기: 센서각 = vehicle각 - yaw -> 중심 95 - (-90) = 185, 폭 130
    #     -> 센서 기준 120 ~ 250. 우측(정면 180, 폭 120)과 같은 구성이다.
    fov_center_deg: 95.0
    fov_width_deg: 130.0
    # 장착 yaw — 2026-08-14 실차 확정. 전제: rplidar inverted=true.
    #   RP 는 정면이 raw 180 이고, 그 값은 각도 부호 반전의 **고정점**이라
    #   inverted 를 바꿔도 yaw 는 그대로다 (YD 와 다른 점 — 헷갈리기 쉽다).
    yaw_deg: -89.8
    note: "중심선에서 +155mm"
  right:
    x: 0.310
    y: -0.155
    z: 0.065
    # ★ 2026-08-13 RViz 확인 후 지정: 이 유닛은 **스캔 raw 180도가 정면**(= 차량 우측)이고
    #   raw 110~230 도만 쓴다. 정면 기준 좌우가 대칭이 아니다(-70 / +50) — 의도된 값이다.
    #   vehicle frame 표기로 옮긴 것이 아래 두 값이다:
    #     센서각 = vehicle각 - yaw  ->  중심 -100 - 90 = -190 ≡ 170,  폭 120  ->  110~230
    fov_center_deg: -100.0
    fov_width_deg: 120.0
    # 장착 yaw — 2026-08-14 실차 확정. 좌측과 같은 모델, 부호만 반대.
    yaw_deg: 87.4
    note: "중심선에서 −155mm"
  rear:
    x: -0.055
    y: 0.0
    z: 0.065
    fov_center_deg: 180.0
    # ★ 2026-08-13 지정값: 이 유닛은 **스캔 raw 270도가 정면**(= 차량 후방)이고,
    #   raw 200~340도만 쓴다. 270 ± 70 -> 폭 140도.
    #   기하 상한(163도)보다 좁게 잡은 것이며, 좁히는 방향이라 안전하다.
    #   센서 기준으로는 -160 ~ -20 도가 된다 (200-360=-160, 340-360=-20).
    fov_width_deg: 140.0
    # 장착 yaw — front 와 같은 모델을 뒤로 돌려 단 것이라 부호만 반대.
    # 검산: 센서기준 시야중심 = fov_center - yaw = 180 - 90 = +90 으로 front(0-(-90)=+90)와 같다.
    #       같은 모델·같은 드라이버 설정이므로 반드시 같아야 하는 값이다.
    yaw_deg: 90.0
    note: "차체 뒷단(−0.090)보다 35mm 안쪽 — 자기가림이 가장 큼. 실측 mask 로 축소 확인 필요"

# 시야각의 성격 (오해 방지)
#   - 바퀴(Ø180)만 하드 오클루더로 본 **기하 상한**에서 여유를 뺀 값이다.
#     라이다 몸체·카메라·케이블·연석은 미반영 → 실측으로 **줄일 수만** 있다.
#   - 최종 확인 수단은 `tools/lidar_fov.py mask` (MEASUREMENTS.md D절, 미완).
#   - 스캔프레임 적용각 = 위 vehicle-frame 각도 − 해당 유닛의 장착 yaw.

# 장착 yaw 최종 (2026-08-14, 겹침 역산으로 확정)
#     front -87.0 |  right +87.4 |  left -89.8 |  rear +90 (미검증)
#
#   앞·좌·우는 `pair_calibrate.py` 로 두 겹침 쌍(앞↔우, 앞↔좌)을 동시에 풀어 얻었다.
#   좌·우가 같은 모델이라 거리 바이어스가 같아야 한다는 구속이 절대 yaw 를 정했다 —
#   한 쌍만으로는 yaw 와 거리 오프셋이 서로 상쇄돼 분리되지 않는다(실측 확인).
#   검증: 캡처 7개에서 두 센서의 같은 평면 인식이 거리 0.70cm / 각도 0.70도 이내로 일치.
#
#   ⚠ rear 는 아직 검증 전이다. 같은 모델이라 front 에서 유도하면 +93 이 되지만,
#     front 가 규약값(-90)과 3도 달랐던 만큼 유닛별 편차가 있다. 뒤↔좌 또는 뒤↔우
#     쌍으로 같은 절차를 밟을 것.
#
#   ★ 이 값은 **드라이버 각도 옵션과 한 세트**다. 하나라도 바꾸면 전부 무효:
#       YD T-mini Plus : lidar_type=1, reversion=true, inverted=false
#       RPLiDAR C1M1   : inverted=true
#     (multi_lidar_fusion/launch/multi_lidar_drivers.launch.py)
#
#   ★ 겪은 함정 — 같은 실수를 반복하지 않기 위해:
#     1) lidar_type=0 으로 띄우면 거리가 **4배**로 나온다 (T-mini Plus 는 1).
#     2) inverted 는 각도 **부호 반전(거울상)**. 정면에 판을 두고 yaw 를 맞추면
#        정면에서는 상쇄되고 **좌우만 뒤집혀** 보여서 원인 찾기가 어렵다.
#     3) 그 반전을 되돌릴 때 yaw 를 네 대 모두 뒤집으면 안 된다. 고정점이 raw 0/180 이라
#        YD(정면 raw 270)만 부호 반전이 필요하고 RP(정면 raw 180)는 그대로 둬야 한다.
#        일괄 적용했다가 좌·우 점이 2개/6개만 남았다.
#
#   검산: 같은 모델끼리 센서기준 시야중심이 같아야 한다 — YD 앞/뒤 raw +90, RP 좌/우 raw ±175.
#   측정법: ros2 launch multi_lidar_fusion view_one_lidar.launch.py unit:=rp0
#           RViz 0~360도 눈금에서 읽고  yaw_deg = (물체의 차량 기준 방위) - (읽은 센서 각도)
fov_status: geometric_upper_bound   # 값: geometric_upper_bound | measured
