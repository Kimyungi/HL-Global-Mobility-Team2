# 한라대학교 기준경로 1~7 시나리오 메타데이터.
# ENU 원점은 기존 한라대 RTK FIXED 웨이포인트 idx 0이다.
origin:
  lat: 37.3041743
  lon: 127.9075328

routes:
- id: 1
  file: waypoints_halla_reference_path_01.csv
- id: 2
  file: waypoints_halla_reference_path_02.csv
  drive_mode: waypoint_only
- id: 3
  file: waypoints_halla_reference_path_03.csv
- id: 4
  file: waypoints_halla_reference_path_04.csv
- id: 5
  file: waypoints_halla_reference_path_05.csv
- id: 6
  file: waypoints_halla_reference_path_06.csv
- id: 7
