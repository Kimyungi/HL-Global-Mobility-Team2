# stack_avoid 파라미터 (M3: 정적 장애물 회피)
# 모든 실측값/설정값의 단일 소스. 코드는 이 파일을 로드해 사용(하드코딩 금지).
# 실측 완료(2026-07-28). /** = 노드 이름 무관 매칭.

/**:
  ros__parameters:

    # ── 전역 변수 (런타임 변경 가능) ────────────────────────────
    #   ros2 param set /stack_avoid_node target_speed_mps <값>
    # ⚠ adas_mgm/config/params.yaml 의 v_base 와 **항상 같은 값**으로 유지할 것.
    #   이 값이 AvoidStatus.v_suggest 로 나가 AVOID 스테이트의 v_ref가 된다
    #   (MGM은 AVOID에서 v_base를 안 쓴다) + TTC 자차속도 폴백.
    # 실제 속도가 없을 때 TTC를 과대평가하지 않도록 MGM 목표와 맞춘다.
    target_speed_mps:   2.0      # 주행 목표속도 [m/s]; TTC 자차속도 폴백
    scan_topic:         /scan    # 앞 LiDAR 스캔 토픽 (변경 시 재시작 필요)

    # ── 차량 좌표 원점 (변경 가능) ──────────────────────────────
    origin_frame: rear_axle        # rear_axle | geometric_center | front_axle

    # ── 차량 제원 (직접 실측) ───────────────────────────────────
    vehicle:
      width_m:            0.62     # 차폭 (420mm 차체 + 200mm) — 사이드미러 미포함
      length_m:           0.85     # 전장 (775mm + 75mm)
      wheelbase_m:        0.595    # 축거 (앞축중심~뒤축중심)
      front_overhang_m:   0.165    # 전방 오버행 → 앞범퍼 = 0.595+0.165 = 0.760m (=LiDAR x)
      max_steer_deg:      27.3     # 등가 조향각 (아커만 안쪽30°/바깥25° 환산)
      min_turn_radius_m:  1.15     # 후축 중심 기준 = wheelbase/tan(27.3°)
      track_width_m:      0.245    # 윤거 (아커만 역산, 좌우 바퀴 중심 간격)
      mirror_included:    false

    # ── LiDAR 장착 (원점→LiDAR) ─────────────────────────────────
    lidar_mount:
      x_m:    0.76     # 후축 중심에서 전방 (앞범퍼 위치)
      y_m:    0.0      # 중앙 정렬
      z_m:    0.065    # 지면 기준 스캔평면 높이 (낮음 — 지면노이즈 필터 주의)
      yaw_deg:   0.0   # 물리 장착 회전 (수평·정면정렬 = 0, TF용)
      roll_deg:  0.0
      pitch_deg: 0.0
      # ★ 차량 전방을 가리키는 "스캔 각도"(드라이버 프레임 관례). 물리 yaw와 별개.
      #   반드시 필드검증: 정면에 물체 두고 RViz /scan_front 로 최소각 확인 후 조정.
      #   stack_estop의 laser_yaw_in_base_rad와 같은 물리 규약을 사용한다.
      #   라이다 재장착 시 두 파라미터를 함께 변경할 것.
      forward_angle_deg: 270.0   # [고정·read_only] 전방 = raw 270° (FOV = raw 180°~360°). 필드검증 확정(2026-08-05). 변경 시 재빌드 필요

    # ── 회피 판단 (정적 장애물) ─────────────────────────────────
    # ★ 실주행 튜닝용 글로벌 변수 — 재시작 없이 변경:
    #     ros2 param set /stack_avoid_node avoid.ttc_stop_s <값>
    #     ros2 param set /stack_avoid_node avoid.lateral_margin_m <값>
    #     ros2 param set /stack_avoid_node avoid.roi_angle_deg <값>
    avoid:
      roi_angle_deg:     180.0  # [튜닝] - {전방 센서범위} 전방 FOV 전체 각도 (180 = 앞쪽 180° 전부, ±90° 반원)
      ttc_stop_s:        1.5    # [튜닝] - {충돌까지 남은시간 계산 후 정지 계산} 회피 성립 최소 TTC [초] (avoidable 판정 재료, stage2)
      lateral_margin_m:  0.15   # [튜닝] - {측방 안전여유(한쪽)} → 통로 반폭 = width/2 + margin
      detect_range_m:    3.5    # 앞범퍼 기준 전방 3.5m 미만에서 장애물 검출
      detect_half_width_m: 0.5  # 차량 중심선 좌우 0.5m 검출; 충돌 여유 폭과 독립
      max_range_m:       12.0   # 센서 한계 (고정)
      # 파생: 통로 반폭 = 0.31 + 0.15 = 0.46 m / 통과 최소폭 = 0.62 + 0.30 = 0.92 m
      # 연결 윤곽 사이에서 경로 후보를 생성할 측방 범위 [m].
      # 매 유효 스캔에서 GPS station을 기준으로 3차 곡선을 재생성한다.
      offset_max_m:      2.5    # 차량 중심 기준 좌우 후보 탐색; 전체 폭 5m
      # 제어점: 회피 중 장애물 옆 목표점, 통과 후 GPS 복귀점. 일반 구간은 GPS s+1m.
      path_spacing_m:    0.05
      waypoint_anchor_m: 1.0  # 현재 GPS station+1m 웨이포인트에서 진입 곡선 시작
      waypoint_return_m: 2.7  # 회피점을 투영한 GPS station+2.7m 웨이포인트로 복귀
      path_pose_timeout_s: 0.5
      path_gps_timeout_s: 0.5
      depth_band_m:      0.6    # 과거 깊이 밴드 호환 설정; 현재 면 기준 목표점 생성에는 미사용
      # 연결 거리 = min(max_link, max(cluster_dist, scale × 빔 간 예상 간격)).
      # 무효 빔/거리 불연속은 분리. 고립점·2점 장애물도 버리지 않는다.
      cluster_dist_m:     0.10  # 인접 빔 연결 거리 하한 [m]
      surface_link_scale: 3.0  # 각도 해상도에 따른 간격 배수
      surface_max_link_m: 0.30 # 서로 다른 물체의 과도한 연결 방지 상한 [m]
