# stack_avoid 파라미터 (M3: 정적 장애물 회피)
# 모든 실측값/설정값의 단일 소스. 코드는 이 파일을 로드해 사용(하드코딩 금지).
# 실측 완료(2026-07-28). /** = 노드 이름 무관 매칭.

/**:
  ros__parameters:

    # ── 전역 변수 (런타임 변경 가능) ────────────────────────────
    #   ros2 param set /stack_avoid_node target_speed_mps <값>
    # ⚠ adas_mgm/config/params.yaml 의 v_base 와 **항상 같은 값**으로 유지할 것.
    #   이 값이 AvoidStatus.v_suggest 로 나가 AVOID 스테이트의 v_ref가 된다
    #   (MGM은 AVOID에서 v_base를 안 쓴다) + TTC 자차속도 폴백.
    #   0.5 → 0.6 (2026-08-15): 조향 곡률 실현율이 0.45~0.50 m/s 14.0% →
    #   0.50~0.55 m/s 23.9%인데, 0.5로 두면 달성 속도가 중앙값 0.494로 임계
    #   아래에 깔린다 (run_0815_155344, 주행 시간의 69%). v_base 주석 참조.
    #   0.6 → 1.0 (2026-08-17, 팀장 결정): adas_mgm v_base 상향과 세트.
    #   근거·함께 올린 안전값(estop 1.20/1.35m, ttc_stop 1.3s)은 v_base 주석 참조.
    #   ⚠ 회피 기하(TTC·측방 여유)는 0.6 m/s 에서 튜닝된 값이다 — 이번 상향의
    #     가장 큰 미검증 구간이다. 회피 단독 시험을 먼저 돌릴 것 (이기돈).
    target_speed_mps:   1.0      # 주행 목표속도 [m/s] — TTC 계산 기준 (자차속도)
    scan_topic:         /scan    # 앞 LiDAR 스캔 토픽 (변경 시 재시작 필요)

    # ── 차량 좌표 원점 (변경 가능) ──────────────────────────────
    origin_frame: rear_axle        # rear_axle | geometric_center | front_axle

    # ── 차량 제원 (직접 실측) ───────────────────────────────────
    vehicle:
      width_m:            0.62     # 차폭 (420mm 차체 + 200mm) — 사이드미러 미포함
      length_m:           0.85     # 전장 (775mm + 75mm)
      wheelbase_m:        0.595    # 축거 (앞축중심~뒤축중심)
      front_overhang_m:   0.165    # 전방 오버행 → 앞범퍼 = 0.595+0.165 = 0.760m (=LiDAR x)
      max_steer_deg:      27.3     # 등가 조향각 (아커만 안쪽30°/바깥25° 환산)
      min_turn_radius_m:  1.15     # 후축 중심 기준 = wheelbase/tan(27.3°)
      track_width_m:      0.245    # 윤거 (아커만 역산, 좌우 바퀴 중심 간격)
      mirror_included:    false

    # ── LiDAR 장착 (원점→LiDAR) ─────────────────────────────────
    lidar_mount:
      x_m:    0.76     # 후축 중심에서 전방 (앞범퍼 위치)
      y_m:    0.0      # 중앙 정렬
      z_m:    0.065    # 지면 기준 스캔평면 높이 (낮음 — 지면노이즈 필터 주의)
      yaw_deg:   0.0   # 물리 장착 회전 (수평·정면정렬 = 0, TF용)
      roll_deg:  0.0
      pitch_deg: 0.0
      # ★ 차량 전방을 가리키는 "스캔 각도"(드라이버 프레임 관례). 물리 yaw와 별개.
      #   반드시 필드검증: 정면에 물체 두고 RViz /scan_front 로 최소각 확인 후 조정.
      #   stack_estop의 laser_yaw_in_base_rad와 같은 물리 규약을 사용한다.
      #   라이다 재장착 시 두 파라미터를 함께 변경할 것.
      forward_angle_deg: 270.0   # [고정·read_only] 전방 = raw 270° (FOV = raw 180°~360°). 필드검증 확정(2026-08-05). 변경 시 재빌드 필요

    # ── 회피 판단 (정적 장애물) ─────────────────────────────────
    # ★ 실주행 튜닝용 글로벌 변수 — 재시작 없이 변경:
    #     ros2 param set /stack_avoid_node avoid.ttc_stop_s <값>
    #     ros2 param set /stack_avoid_node avoid.lateral_margin_m <값>
    #     ros2 param set /stack_avoid_node avoid.roi_angle_deg <값>
    avoid:
      roi_angle_deg:     180.0  # [튜닝] - {전방 센서범위} 전방 FOV 전체 각도 (180 = 앞쪽 180° 전부, ±90° 반원)
      ttc_stop_s:        1.5    # [튜닝] - {충돌까지 남은시간 계산 후 정지 계산} 회피 성립 최소 TTC [초] (avoidable 판정 재료, stage2)
      lateral_margin_m:  0.15   # [튜닝] - {측방 안전여유(한쪽)} → 통로 반폭 = width/2 + margin
      detect_range_m:    3.0    # [튜닝] - {감지거리} 이 거리 안이면 obstacle_detected [m] 
      max_range_m:       12.0   # 센서 한계 (고정)
      # 파생: 통로 반폭 = 0.31 + 0.15 = 0.46 m / 통과 최소폭 = 0.62 + 0.30 = 0.92 m
      # ── 회피 목표점(1개, follow-the-gap · 양쪽 고려) ──
      # [튜닝] 측방 회피 오프셋 상한 [m].
      # ★ 1.0 → 1.6 (2026-08-10). 우측에 넓은 빈 공간이 있는데 목표가 안 잡히는
      #   현상의 원인이었다(실차 규명): 바깥 후보 = 끝 blocker ∓ clear 라, 그쪽에
      #   |y| > offset_max − clear 인 blocker 가 하나라도 있으면 "돌아가기" 자체가
      #   불가능해진다. 실측 장면에서 우바깥 후보가 −1.51 인데 1.3 이 막고 있었다.
      #   ⚠ 이 값만 올리면 목표 y 가 프레임당 1.5m 씩 튀어 추종이 무너진다
      #     (실측: 1m 초과 점프 8 → 24회). 반드시 아래 target_rate_limit_mps 와 함께 쓸 것.
      #   2개 bag 재생 검증: 1.6 + rate 3.0 이 1.3 + 무제한보다 모든 지표에서 낫다
      #     narrow_gap 11→0 · 36→19,  1m 초과 점프 8→2 · 7→0,  표면뒤 목표 0 유지.
      offset_max_m:      1.6
      # ★ 목표 y 변화율 상한 [m/s]. 0 = 제한 없음(구동작).
      #   3.0 = 10Hz 스캔에서 프레임당 0.30m. 열림이 바뀔 때의 급변만 깎고 평상시
      #   미동(중앙값 0.01m)에는 영향이 없다. 속도 제한된 중간값이 장애물 표면 뒤면
      #   적용하지 않고 그냥 점프한다(부드러움보다 정확성 우선).
      target_rate_limit_mps: 3.0
      scan_rate_hz:      10.0   # dt 이상치 대체용 (T-mini Plus 실측)
      # ── maneuver_done 클리어런스 (조기 복귀 = 측면 충돌이라 안전 직결)
      # 통과거리 = min(마지막 감지거리, clear_gap_max) + 전장(0.85) + clear_margin
      # ★ clear_gap_max 1.0 → 3.0 (2026-08-14 실차 측면 충돌 2회로 상향).
      #   감지 소실은 "통과"가 아니라 회피 조향으로 장애물이 통로를 **측방** 이탈한
      #   것이다. 3.0m에서 감지 시작 → 1.1초 뒤(≈2.45m) 소실인데 상한 1.0 때문에
      #   통과거리를 2.15m(4.3s)로 잡아 조기 복귀 → 콘이 0.8m 앞 재출현(ttc 0.1).
      #   필요값은 2.45+0.85+0.3 = 3.6m(7.2s)였다. detect_range로 자연 유계.
      #   과대 대기 시 횡오차 누적은 "통과 유지점 (1.5,0)"이 막는다(2026-08-13 도입).
      clear_gap_max_m:   3.0    # [튜닝] 클리어런스에 쓰는 마지막 감지거리 상한 [m]
      clear_margin_m:    0.3    # [튜닝] 통과 판정 추가 여유 [m]
      depth_band_m:      0.6    # [튜닝] 장애물 전방거리 ±이 값 안의 blocker를 양쪽 고려 [m]
      cluster_min_points: 3
      cluster_dist_m:     0.10
