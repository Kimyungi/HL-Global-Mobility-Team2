mgm_node:
  ros__parameters:
    # 기본은 최신 C++ core. generated는 빌드 opt-in과 아래 명시적 확인을 모두
    # 요구하는 ADAS_MGR2 v1.88 4상태 실험 backend다. v1.88에는 main의 rear escape가
    # 없으므로 generated 선택 시 escape_after_cycles는 반드시 0이어야 한다.
    backend: core
    # SAFE_STOP only when BOTH cameras, ALL four raw LiDARs and GPS are unavailable.
    # Operator/CAN stop, AUTO_ESTOP and invalid-command output hold are separate.
    safe_stop_all_sensors_only: true
    route_sequence_enabled: false  # enabled by launch only with an explicit ordered manifest
    generated_backend_acknowledge_limited_scope: false

    # C++ core defaults to parallel managers; generated defaults to historical
    # behavior. base_state_machine_enabled can explicitly select legacy replay.
    # Missions start on entry to a MISSION_ZONE published by stack_gps.
    # Configure GPS parking ranges or explicit Zone definitions in zones_file.
    # MGM has no waypoint-reached topic or waypoint-ID mission mapping.

    # Enter Parking at stable Zone entry; follow GPS while searching, Parking owns control after ready.
    # Normal release: parking done or current CSV endpoint. Zone exit is not a release.
    parking_zone_entry_active: true
    parking_search_zone_only: false  # historical PREPARE policy, only if immediate entry is false
    # Independent GNSS samples. User selected 5/5 for v2 on 2026-09-12.
    # This is a configured value, not field-validation certification; 0 remains UNSET.
    zone_enter_confirm_samples: 5
    zone_exit_confirm_samples: 5
    parking_search_timeout: -1.0
    max_parking_search_distance: -1.0
    mission_events_csv_path: ""

    # lane ↔ waypoint 히스테리시스 (CLAUDE.md §4)
    # 2026-08-14 run_0814_184624 실측으로 상향: 차선 confidence가 평균 0.47,
    # 중앙 0.48로 구 임계(0.4/0.6) 밴드 안에서 진동 → 110초에 전이 22회,
    # 횡오차 8m 발산. 밴드를 벌리고 연속 조건을 500ms로 늘린다.
    # 되돌릴 땐 이 run의 덤프로 core_replay 파라미터 오버라이드 재생해 비교할 것.
    lane_conf_exit: 0.35
    lane_conf_return: 0.70
    n_cycles: 50            # 10ms × 50 = 500ms 연속

    # 새 core: 최초 obstacle clear부터 2초 확인과 동시에 시작하는 LINE 보류.
    # legacy: avoid→waypoint 복귀 후 lane 전이 보류 [틱].
    # 회피 직후 차는 트랙을 벗어나 있다 — GPS 재합류에 필요한 시간을 확보한다.
    # 0이면 카운터 리셋만 적용(= n_cycles 만큼만 보류).
    avoid_return_hold_cycles: 300   # 3.0s

    # waypoint→lane 전이 허용 최대 횡오차 [m] — "트랙에 실제로 재합류한 뒤에만
    # 카메라로 넘어간다". 시간 게이트만으로는 이탈한 채 lane이 돼버리고, 그러면
    # GPS 트랙 복귀는 영영 못 한다 (2026-08-14 run_0814_195116: 복귀 시점
    # 횡오차 0.90m·2.72m). 0 이하면 게이트 끔.
    # 0.5m 근거: 정상 GPS 주행 실측 횡오차가 평균 0.075m·최대 0.24m이므로
    # 정상 주행은 항상 통과하고, 회피 이탈(0.9m+)만 걸린다.
    lane_entry_max_cross_m: 0.5

    # AVOID 최대 지속 [틱]. 양수이면 장애물 미검출·회피 경로 유효 시 GPS 복귀를 시작한다.
    # 기본 0: 미관측 장애물 뒤로 시간만으로 복귀하지 않고 station 경로 완료를 기다린다.
    avoid_max_cycles: 0       # station 경로: 관측상 비어 있는 GPS 복귀 경로 도달로 완료

    # 스테이트별 속도 [m/s] (2026-09-14: 일반/회피 목표 2.0)
    # v2 일반 Navigation/주차 목표속도 크기. 주차 후진은 -v_base.
    # stack_avoid target_speed_mps도 같은 값으로 유지한다 (TTC 속도 폴백).
    # AVOID는 v_avoid/v_narrow 상한과 a_up/a_down을 적용한다.
    # 회피 종료 후 Navigation 속도 복귀까지 ramp를 유지한다.
    v_base: 2.0
    v_accel_zone: 2.0
    v_narrow: 0.2

    # AVOID 전용 속도 상한 [m/s]; 0이면 상한 없음.
    # 3.5m에서 2m/s 접근 시 TTC=1.75s; 접근 중 기존 TTC 정지 기준은 계속 적용.
    v_avoid: 2.0

    # ── 지정 지점 정지 [틱] (2026-08-18) — GpsPath.stop_zone 지점에 도달하면
    # 정지하고 이만큼 머문 뒤 스스로 재출발한다. 300틱 = 3.0s.
    # 지점을 안 잡으면(stack_gps stop_points_latlon 비어 있음) stop_zone 이 항상
    # 0이라 아무 일도 없다 — 그래서 여기 기본값을 켜 두어도 안전하다.
    # 카운트다운은 **실제로 멈춘 뒤** 시작한다(감속 시간은 정차 시간에서 안 깎임).
    stop_zone_hold_cycles: 300

    # CSV state=4 / GPS 회피 구간에서 AVOID 진입, 실제 waypoint 복귀 후 종료.
    # 장애물 유무와 무관하게 시작하며 완료된 시작 표식은 반복 실행하지 않는다.
    # 구간 밖 독립 LiDAR E-stop과 Parking의 기존 우선권은 유지한다.
    lidar_estop_enabled: true
    avoidance_enabled: true
    avoid_zone_only: true

    # ── 1/10 무인 RC 시험: 후방에 사람·장애물이 없는 구역, 운전자 물리 정지 감시.
    # 기존 문서 기준 1000틱 = 정상 10ms 주기에서 E-stop 연속 10초. 0 = 끔.
    # 장애물의 정지/이동 추적 시간이 아니라 실제 E-stop 입력의 연속 유지 시간이다.
    escape_after_cycles: 1000
    # 일반 v_base와 독립적인 후진 목표속도 [m/s]. 유한 음수만 허용한다.
    v_escape: -0.8
    # 162틱 × 10ms × 0.8m/s = 명령상 1.296m (약 1.3m).
    # 시간 제한이며 실측 거리 정지 제어는 아니다. 실제 정차 거리는 다를 수 있다.
    escape_max_cycles: 162
    # 이 RC 시험에서는 후방 bool/valid/CLEAR에 의존하지 않는다.
    # true이면 기존 typed rear safety gate를 진입·후진 중·최종 reference에 적용한다.
    # 주차 제외, 외부/operator/CAN/전방 입력 freshness/최종 reference 정지는 유지한다.
    escape_require_rear_clear: false

    # Legacy replay only. v2 does not create E-stop/route holds from avoid TTC.
    # v2 E-stop input is the independent stack_estop request.
    ttc_stop: 1.3           # [s], unused by v2 base manager

    # 역방향 정지 (§4 waypoint) — |ref[0].yaw| > 2.1rad(120°)가 50틱(0.5s)
    # 지속되면 차가 경로를 등진 것 → v_ref 0 (유턴 후 트랙 역추종 차단)
    wrongway_yaw_rad: 2.1
    wrongway_cycles: 50

    # estop 입력 신선도 watchdog (wrapper 입력 컨디셔닝 — 판단은 코어)
    # 미수신 또는 이 시간 초과 staleness → 스냅샷 estop=true 보정.
    # stack_estop 하트비트 50ms 기준 5주기.
    estop_stale_timeout_sec: 0.25
    traffic_stale_timeout_sec: 0.5   # 수신 이력 후 끊김만 보정 (§5.7 ③) — 미수신은 단독 스택 시험 허용
    vehicle_stale_timeout_sec: 0.2   # TRAFFIC / Mission Search 거리 적분용 실제 속도 freshness
    traffic_state_enabled: true      # 적색+정지선 동시 검출 시 TRAFFIC 진입 (generated v1.88에서는 false만 허용)
    # ── 정지 거리 추적 (§4 traffic, 2026-09-02 개정 — 사용자 지정, 정지선
    # 소실 edge 기준). 카메라 optical-Z 거리는 검출이 불안정하면 즉시 무효가
    # 돼 그 자체로는 연속 신뢰 기준으로 못 쓴다 — "정지선이 화면에서 사라지는
    # 시점(true→false) = 카메라 장착 기준 대략 고정된 거리"를 시드로 삼고
    # 그 뒤로는 실측 차속으로 dead-reckoning한다. 정지선을 한 번도 못 봤으면
    # (=소실 edge가 없었으면) v_base로 그냥 통과한다 — 검증 단계에서 정지선
    # 인지가 미더운 채로 "못 봤으면 무조건 정지"는 잦은 오정지를 만든다는
    # 판단(사용자 지정, mgm_step.cpp 참조).
    traffic_ramp_distance_m: 1.5     # 소실 edge에서의 시드 거리 [m]
    # 가드 문턱 겸 완전 정지 문턱 [m] — 빨간불 미확정 상태에서 거리가 이
    # 이하로 떨어지면 시드로 되돌려 붙잡아둔다(무관한 정지선을 스친 낡은
    # 값이 나중에 급정지로 이어지는 것 방지). 빨간불 확정 후에는 이 이하에서
    # 완전 정지(v_ref=0). "시드(1.5m)에서 0.5m 이상 진행해야만 실제 정지가
    # 성립"과 동일한 값(사용자 지정, 2026-09-02). ⚠ seed와의 차(0.5m)가 ramp
    # 구간이라 제동 여유가 빡빡하다 — 2m/s 목표속도 검토 시 traffic_ramp_distance_m도
    # 같이 올릴지 재검토 필요(사용자 확인).
    # Base Manager: 앞범퍼 잔여거리 목표 1.0m; 최초 소실 seed 1.5m, 실제 |v| 적분.
    # 위 pre-red 재시드 설명은 legacy false 경로에만 해당한다.
    traffic_stop_offset_m: 1.0
    # lane/gps 경로 신선도 (§5.7 ②) — 해당 소스를 쓰는 스테이트에서만 적용.
    # gps는 staleness 외에 fix_quality=0/빈 경로(신선하지만 무효)도 동일 보정.
    # lane 1.0s: 산업용 PC는 GPU 없어 CPU 추론 2.5Hz(프레임 간격 최대 0.45s 실측,
    # 2026-08-11) — 0.5s면 정상 동작 중에도 오탐 estop. 사망 감지는 1.0s로도 성립
    # (0.5m/s 기준 이동 0.5m).
    # Parallel core: these existing per-provider limits also bound actual
    # reference_stamp age. Republishing does not renew it. LINE uses this 1.0s
    # operating override; node defaults and GPS/Avoidance/Parking are 0.5s.
    lane_stale_timeout_sec: 1.0
    gps_stale_timeout_sec: 0.5
    # avoid 신선도 (§5.7 ⑤) — stale이면 진입 재료(obstacle_detected·avoidable)
    # 무효화 + AVOID 스테이트 중이면 estop 보정. stack_avoid 발행 주기 = 스캔
    # 10Hz이므로 0.5s = 5주기 결손.
    avoid_stale_timeout_sec: 0.5

    # ⚠ v_base 1.0 과 함께 바꾼 것들 (되돌릴 땐 세트로):
    #   stack_avoid target_speed_mps 0.6→1.0 · ttc_stop 0.8→1.3
    #   launch estop_on/off 0.70/0.80→1.20/1.35 · dynamic_stop 1.20→1.35
    #   (detect_range_m 은 **건드리지 않는다** — RUNBOOK §5-1c 결론)

    # 조립/병합 (실행부 파라미터 — 판단 아님)
    blend_cycles: 10        # 스테이트 전환 시 ref 블렌드 구간 (틱)
    a_up: 0.5               # [m/s^2] 가속 rate limit
    a_down: 1.5             # [m/s^2] 일반 감속 rate limit (긴급은 우회)

    # 실시간 (§5.2, §5.3)
    cpu_core: -1            # >=0 이면 해당 코어에 루프 스레드 고정
    jitter_window: 1000     # 10s 단위 통계
    jitter_csv_path: ""     # 예: "/home/yungi/mgm_jitter.csv" — §7 장시간 측정 시 지정

    # back-to-back 검증 (§5.5) — 지정 시 매 틱 CoreSnapshot을 바이너리 덤프
    snapshot_dump_path: ""  # 예: "/home/yungi/mgm_snapshots.bin" → core_replay로 재생
