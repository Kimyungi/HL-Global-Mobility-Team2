mgm_node:
  ros__parameters:
    # 기본은 최신 C++ core. generated는 빌드 opt-in과 아래 명시적 확인을 모두
    # 요구하는 ADAS_MGR2 v1.88 4상태 실험 backend다. v1.88에는 main의 rear escape가
    # 없으므로 generated 선택 시 escape_after_cycles는 반드시 0이어야 한다.
    backend: core
    generated_backend_acknowledge_limited_scope: false

    # lane ↔ waypoint 히스테리시스 (CLAUDE.md §4)
    # 2026-08-14 run_0814_184624 실측으로 상향: 차선 confidence가 평균 0.47,
    # 중앙 0.48로 구 임계(0.4/0.6) 밴드 안에서 진동 → 110초에 전이 22회,
    # 횡오차 8m 발산. 밴드를 벌리고 연속 조건을 500ms로 늘린다.
    # 되돌릴 땐 이 run의 덤프로 core_replay 파라미터 오버라이드 재생해 비교할 것.
    lane_conf_exit: 0.35
    lane_conf_return: 0.70
    n_cycles: 50            # 10ms × 50 = 500ms 연속

    # avoid→waypoint 복귀 후 lane 전이 보류 [틱] (§4 복귀 정책 실효화)
    # 회피 직후 차는 트랙을 벗어나 있다 — GPS 재합류에 필요한 시간을 확보한다.
    # 0이면 카운터 리셋만 적용(= n_cycles 만큼만 보류).
    avoid_return_hold_cycles: 300   # 3.0s

    # waypoint→lane 전이 허용 최대 횡오차 [m] — "트랙에 실제로 재합류한 뒤에만
    # 카메라로 넘어간다". 시간 게이트만으로는 이탈한 채 lane이 돼버리고, 그러면
    # GPS 트랙 복귀는 영영 못 한다 (2026-08-14 run_0814_195116: 복귀 시점
    # 횡오차 0.90m·2.72m). 0 이하면 게이트 끔.
    # 0.5m 근거: 정상 GPS 주행 실측 횡오차가 평균 0.075m·최대 0.24m이므로
    # 정상 주행은 항상 통과하고, 회피 이탈(0.9m+)만 걸린다.
    lane_entry_max_cross_m: 0.5

    # AVOID 최대 지속 [틱] — 초과 시 maneuver_done과 무관하게 waypoint 복귀.
    # AVOID 중 경로는 "전방 직진 유지"라 틀어진 헤딩을 유지한다. 상한이 없으면
    # 무한히 트랙에서 멀어진다 (2026-08-15 run_0815_143039: 감지 경계에 걸친 벽이
    # 20초에 28회 깜빡여 클리어런스 타이머가 매번 리셋 → AVOID 15초+ → 횡오차 5.3m).
    # 1200틱=12s 근거: 정상 통과 대기 최댓값이 (3.0+0.85+0.3)/0.5 = 8.3s이므로
    # 정상 회피는 절대 안 걸리고, 비정상 고착만 끊는다. 0 이하면 상한 없음.
    avoid_max_cycles: 1200

    # 스테이트별 속도 [m/s]
    # 0.5 복원 (2026-08-06): 위빙 원인이 ref 첫 점 기하(lookahead 0)로
    # 확정·해결됨 — 직선 실측 cross 평균 0.075m/최대 0.24m. 속도를 더
    # 올릴 땐 stack_gps ref_lookahead_m도 함께 검토 (미리보기 시간
    # = lookahead/v: 1m@0.5=2s, 1m/s부턴 1.2~1.5m 권장).
    #
    # 0.5 → 0.6 (2026-08-15). "조향은 v ≥ 0.5 m/s에서만 제대로 반응"(§3 ①,
    # 이기돈)이 run_0815_155344에서 정량 재현됐다 — 곡률 실현율:
    #     0.30~0.45 m/s  9.7%  |  0.45~0.50 m/s 14.0%  |  0.50~0.55 m/s 23.9%
    # 문제는 v_base를 임계값에 딱 맞춰 두면 추종 오차·마찰로 계속 미달 쪽에
    # 떨어진다는 것: 같은 run에서 **달성 속도 중앙값 0.494, 주행 시간의 69%가
    # 0.5 미만**이었다. 목표를 0.6으로 올려 임계 위에서 돌게 한다.
    # 25초 주기 위빙(±11°)과 AVOID 헤딩 누적 양쪽의 공통 원인이 이 저이득이다.
    # ⚠ stack_avoid/config/params.yaml 의 target_speed_mps 와 **반드시 같이** 바꿀 것
    #   (그쪽이 AVOID 스테이트의 v_suggest 소스 — launch 주석에도 명시).
    # ⚠ lookahead는 그대로 1.8m: 미리보기 3.6s → 3.0s 로 위 권장(2s)보다 여유.
    # 0.6 → 1.0 (2026-08-18). 차선·GPS 만 올리고 **회피는 v_avoid 로 0.6 유지**한다.
    # 2026-08-17 의 1.0 시도(run_0817_041219)는 회피가 79초 중 41초(52%)를 먹고
    # 횡오차 2.08m 로 되돌렸는데, 그 원인은 속도가 아니라 **회피 트리거 빈도**였다
    # (진입 1회 = 12초 고정 × detect_range 3.0→5.0 상향). 지금은 두 가지가 다르다:
    #   · detect_range 는 3.0 그대로 (그때의 처방이 틀렸다는 것이 §5-1c 결론)
    #   · 회피가 **구간 게이트**로 묶여 지정 구간 밖에서는 아예 진입하지 않는다
    # 차선 구간은 그 run 에서도 1.0 m/s 에서 멀쩡했다 (cross 평균 0.061~0.114m).
    # ⚠ stack_avoid 의 target_speed_mps 도 **반드시 같이** 1.0 으로 (TTC 자차속도).
    v_base: 1.0
    v_accel_zone: 1.0
    v_narrow: 0.2

    # AVOID 스테이트 전용 속도 상한 [m/s] — **0 = 상한 없음(구동작), 현재 꺼짐.**
    #
    # 기구는 남겨 두되(2026-08-17 신설, core_replay 로 검증 완료) v_base 가 0.6 이라
    # 지금은 쓸 일이 없어 끈다. v_base 를 1.0 이상으로 올릴 때 **회피 구간만 0.6 으로
    # 유지하는 용도**로 켜면 된다 — `ros2 param set /adas_mgm_node v_avoid 0.6`.
    #
    # ★ 켤 때 stack_avoid 의 target_speed_mps 를 내리는 방식은 쓰지 말 것.
    #   그 값은 ① v_suggest ② **TTC 자차속도 폴백**(`/vehicle/vector` 미수신 시 —
    #   실측 0건이라 항상 폴백)을 겸한다. v_base 1.0 으로 달리며 그것만 0.6 으로
    #   내리면 TTC = gap/0.6 이 되어 1.67배 부풀고 avoidable 판정·TTC 안전 바닥이
    #   그만큼 늦게 걸린다. target_speed_mps 는 항상 v_base 와 같게 두어 TTC 를
    #   정직하게 유지한다 (§3 규약).
    # ⚠ 켜면 §3 ① "감속하면서 조향 금지"와 겹친다: 진입 시 v_base → v_avoid 감속이
    #   생긴다. 회피 시험의 확인 대상 (RUNBOOK §5-1c).
    # 회피 구간만 0.6 유지 (2026-08-18) — v_base 를 1.0 으로 올리면서 켰다.
    # 진입 시 1.0 → 0.6 감속이 생기지만 조향 응답 하한 0.5 위이고 a_down 1.5 로
    # 0.27s 면 끝난다 (run_0812_234253 의 0.44 무반응과는 다름). 회피 시험 확인 대상.
    v_avoid: 0.6

    # ── 지정 지점 정지 [틱] (2026-08-18) — GpsPath.stop_zone 지점에 도달하면
    # 정지하고 이만큼 머문 뒤 스스로 재출발한다. 300틱 = 3.0s.
    # 지점을 안 잡으면(stack_gps stop_points_latlon 비어 있음) stop_zone 이 항상
    # 0이라 아무 일도 없다 — 그래서 여기 기본값을 켜 두어도 안전하다.
    # 카운트다운은 **실제로 멈춘 뒤** 시작한다(감속 시간은 정차 시간에서 안 깎임).
    stop_zone_hold_cycles: 300

    # 회피 허용 구간 밖에서 AVOID 전이 금지 (2026-08-18). 기본은 **끔** = 어디서나
    # 회피(구동작). **launch 기본값도 끔이다** — 회피를 지정 구간에만 쓰려는 코스
    # (원주 운전면허시험장)에서만 avoid_zone_only:=true 를 인자로 준다.
    #   ⚠ 2026-08-19~08-25 사이에는 실차 launch 2종이 이것을 true 로 기본 탑재해
    #     **원주 전용 선택이 전 코스 기본**이 돼 있었다. 한라대에서 회피가 통째로
    #     막혀(run_mbd_0825_162752) 08-25 에 되돌렸다.
    # ⚠ 켜면 구간 밖 장애물의 방어선은 stack_estop 뿐이다 (MGM 의 TTC 안전 바닥은
    #   AVOID 스테이트 안에서만 걸린다).
    avoid_zone_only: false

    # ── 후진 탈출 (2026-08-24, §4) — 회피 불가 장애물 앞에서 estop 이 무한히
    # 유지되는 교착을 끊는다. estop 은 레벨 신호라 장애물이 치워져야 풀리는데,
    # 시험 코스에는 치워질 일이 없는 장애물이 있다. 그러면 v_ref 0 으로 영원히
    # 서 있게 되므로, 충분히 오래 갇혀 있었으면 곧게 조금 물러나 회피가 성립하는
    # 거리를 만들고 AVOID 로 넘어간다.
    #
    # **기본 끔(0).** 켜기 전에 반드시 확인할 것:
    #   ① stack_estop 이 EstopRequest.rear_clear 를 채우고 있는가 (2026-08-24
    #      기준 **미구현** — 후방 라이다 통합은 이기돈 판단). 안 채우면 항상
    #      false 라 escape_require_rear_clear: true 인 동안 기능이 자연히 잠긴다.
    #   ② dSPACE 가 음수 v_ref 로 실제 후진하는가 (MPC·하위 PI 부호 — 팀 확인 완료
    #      2026-08-24, 실차 재확인 권장).
    # 1000틱 = 10.0s 연속 estop 이면 개시. 0 = 끔.
    escape_after_cycles: 0
    # 후진 목표 속도 [m/s] — **반드시 음수**. 0 이상이면 코어가 기능을 잠근다
    # (안전 불변식: 탈출 페이즈가 구조적으로 전진할 수 없게 만드는 장치).
    v_escape: -0.3
    # 후진 최대 틱 = 거리 상한. 200틱 × 10ms × 0.3m/s = 0.6m. 0 이하면 끔 —
    # 상한 없는 후진은 만들지 않는다.
    escape_max_cycles: 200
    # 후방 여유(EstopRequest.rear_clear)가 확인될 때만 후진한다. **기본 켬.**
    # 끄면 뒤를 보지 않고 시간 상한만으로 물러난다 — 관측자를 세운 시험에서만 쓸 것.
    escape_require_rear_clear: true

    # avoid 안전 바닥 — 속도에 비례해 올린다 (2026-08-18, v_base 0.6→1.0).
    # 1.0 m/s 정지 필요거리 1.09m (§5-1c 실측식) ÷ 1.0 m/s ≈ 1.1s + 여유.
    ttc_stop: 1.3           # [s]

    # 역방향 정지 (§4 waypoint) — |ref[0].yaw| > 2.1rad(120°)가 50틱(0.5s)
    # 지속되면 차가 경로를 등진 것 → v_ref 0 (유턴 후 트랙 역추종 차단)
    wrongway_yaw_rad: 2.1
    wrongway_cycles: 50

    # ── 신호등 정지 ramp (§4, 2026-09-01) — traffic_stop_required 가 뜨는
    # 순간 v_ref 를 곧장 0으로 떨어뜨리던 것을 거리 기반으로 서서히 줄인다.
    # stack_traffic 의 카메라 stop_distance(px 기준)는 흔들리면 즉시 -1이라
    # 그대로는 못 쓴다 — 대신 stack_traffic.stopline_detected 가 true→false로
    # 떨어지는 시점(=정지선이 화면에서 사라짐)을 "카메라 장착 기준 고정 거리"로
    # 시드하고, 그 뒤로는 /vehicle/vector 실측 차속으로 dead-reckoning 한다.
    # bridge_dspace/tools/camera_traffic_ref_test.py 로 검증한 방식을 그대로
    # core 로 옮긴 것 — stopline_detected 이벤트가 없는 run(stack_traffic
    # stopline_detection_enabled=false 포함)에서는 거리를 몰라 종전과 동일하게
    # 즉시 0 으로 떨어진다. 실차 미검증 — 카메라 장착 고정 후 재보정 권장.
    traffic_ramp_reset_distance_m: 1.5
    traffic_ramp_stop_distance_m: 0.5

    # estop 입력 신선도 watchdog (wrapper 입력 컨디셔닝 — 판단은 코어)
    # 미수신 또는 이 시간 초과 staleness → 스냅샷 estop=true 보정.
    # stack_estop 하트비트 50ms 기준 5주기.
    estop_stale_timeout_sec: 0.25
    traffic_stale_timeout_sec: 0.5   # 수신 이력 후 끊김만 보정 (§5.7 ③) — 미수신은 단독 스택 시험 허용
    # lane/gps 경로 신선도 (§5.7 ②) — 해당 소스를 쓰는 스테이트에서만 적용.
    # gps는 staleness 외에 fix_quality=0/빈 경로(신선하지만 무효)도 동일 보정.
    # lane 1.0s: 산업용 PC는 GPU 없어 CPU 추론 2.5Hz(프레임 간격 최대 0.45s 실측,
    # 2026-08-11) — 0.5s면 정상 동작 중에도 오탐 estop. 사망 감지는 1.0s로도 성립
    # (0.5m/s 기준 이동 0.5m).
    lane_stale_timeout_sec: 1.0
    gps_stale_timeout_sec: 0.5
    # avoid 신선도 (§5.7 ⑤) — stale이면 진입 재료(obstacle_detected·avoidable)
    # 무효화 + AVOID 스테이트 중이면 estop 보정. stack_avoid 발행 주기 = 스캔
    # 10Hz이므로 0.5s = 5주기 결손.
    avoid_stale_timeout_sec: 0.5

    # ⚠ v_base 1.0 과 함께 바꾼 것들 (되돌릴 땐 세트로):
    #   stack_avoid target_speed_mps 0.6→1.0 · ttc_stop 0.8→1.3
    #   launch estop_on/off 0.70/0.80→1.20/1.35 · dynamic_stop 1.20→1.35
    #   (detect_range_m 은 **건드리지 않는다** — RUNBOOK §5-1c 결론)

    # 조립/병합 (실행부 파라미터 — 판단 아님)
    blend_cycles: 10        # 스테이트 전환 시 ref 블렌드 구간 (틱)
    a_up: 0.5               # [m/s^2] 가속 rate limit
    a_down: 1.5             # [m/s^2] 일반 감속 rate limit (긴급은 우회)

    # 실시간 (§5.2, §5.3)
    cpu_core: -1            # >=0 이면 해당 코어에 루프 스레드 고정
    jitter_window: 1000     # 10s 단위 통계
    jitter_csv_path: ""     # 예: "/home/yungi/mgm_jitter.csv" — §7 장시간 측정 시 지정

    # back-to-back 검증 (§5.5) — 지정 시 매 틱 CoreSnapshot을 바이너리 덤프
    snapshot_dump_path: ""  # 예: "/home/yungi/mgm_snapshots.bin" → core_replay로 재생
