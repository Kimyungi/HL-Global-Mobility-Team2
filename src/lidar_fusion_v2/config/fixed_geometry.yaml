/**:
  ros__parameters:
    base_frame: base_link
    sensor_ids: [a1, a2, b1, b2]
    publish_rate_hz: 10.0
    # 10 Hz 센서가 일시적으로 한두 프레임 늦어져도 시야가 깜빡이지 않게 유지한다.
    max_age_s: 0.50
    scan:
      angle_increment_deg: 1.0
      range_min: 0.15
      range_max: 12.0
    sensors:
      # a1을 고정 기준으로 두고 a2/b1/b2를 긴 벽 공동 보정으로 정렬한다.
      # 시야각은 보정 대상이 아니며 아래 고정값을 그대로 유지한다.
